<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
  // Applied before the stylesheet paints so light-mode users don't see a flash of dark first.
  try{
    var t = localStorage.getItem('nms-buddy-theme');
    if(t === 'light') document.documentElement.setAttribute('data-theme','light');
  }catch(e){}
</script>
<title>NMS.Buddy — Voyage Log</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,100..900;1,100..900&family=Atkinson+Hyperlegible+Mono:wght@400..800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0C0C11;
    --bg-2:#15151b;
    --panel:#16161d;
    --panel-2:#1a1a22;
    --panel-3:#202029;
    --border:#2a2a35;
    --border-soft:#1e1e26;
    --text:#ffffff;
    --text-dim:#a8adb8;
    --text-faint:#6b7280;
    --cyan:#79bbe8;
    --cyan-dim:#28343f;
    --orange:#d9a33c;
    --violet:#b185df;
    --green:#8fbf7a;
    --red:#e2748c;
    --chip:#c2c7ce;
    /* fixed roles: planets are always blue, moons are always grey */
    --planet-c:#79bbe8;
    --moon-c:#9298a6;
    /* single accent used for all "meta" info: kind/type labels + resource chips */
    --meta-c:#d9a33c;
    /* theme-aware extras: glow/hover tints so light mode doesn't inherit dark-only colors */
    --glow-gold: rgba(217,163,60,.6);
    --hover-bg-red:#2a1620;
    --hover-bg-green:#1c2a18;
    --hover-bg-grey:#20222a;
    --tint-violet: rgba(177,133,223,0.10);
    --tint-cyan: rgba(121,187,232,0.08);
    --galaxy-tint: rgba(155,140,255,0.18);
    --overlay-bg: rgba(6,7,10,.72);
  }

  /* ---------- Light theme ----------
     Same structure, every token re-mapped for a white/light background.
     Gold (--orange/--meta-c) is deepened so it stays readable on white —
     the dark-mode gold is too pale for light backgrounds. */
  :root[data-theme="light"]{
    --bg:#f6f7fa;
    --bg-2:#ffffff;
    --panel:#ffffff;
    --panel-2:#f2f3f6;
    --panel-3:#e9ebf0;
    --border:#d8dae1;
    --border-soft:#e4e6eb;
    --text:#000000;
    --text-dim:#000000;
    --text-faint:#33353b;
    --cyan:#1f6fb2;
    --cyan-dim:#dceaf6;
    --orange:#92660d;
    --violet:#7c4fb0;
    --green:#3f7a34;
    --red:#c23b57;
    --chip:#4b4f59;
    --planet-c:#1f6fb2;
    --moon-c:#5b6270;
    --meta-c:#92660d;
    --glow-gold: rgba(146,102,13,.30);
    --hover-bg-red:#fbe6ea;
    --hover-bg-green:#e7f2e3;
    --hover-bg-grey:#eceef2;
    --tint-violet: rgba(124,79,176,0.06);
    --tint-cyan: rgba(31,111,178,0.05);
    --galaxy-tint: rgba(124,79,176,0.08);
    --overlay-bg: rgba(20,21,26,.45);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, var(--tint-violet), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, var(--tint-cyan), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:28px 20px 80px;
    transition:background-color .2s;
    zoom:1.3;
  }
  .wrap{max-width:1180px;margin:0 auto;}
  .main-layout{display:flex;gap:20px;align-items:flex-start;}
  .fav-col{width:240px;flex-shrink:0;position:sticky;top:20px;}
  .content-col{flex:1;min-width:0;}
  @media (max-width:820px){
    .main-layout{flex-direction:column;}
    .fav-col{width:100%;position:static;}
  }

  /* ---------- Top nav ---------- */
  .topnav{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding-bottom:16px;margin-bottom:16px;
    border-bottom:1px solid var(--border-soft);
  }
  .brand{
    font-family:'Inter',sans-serif;font-weight:800;font-size:19px;letter-spacing:.01em;
    color:var(--text);cursor:pointer;user-select:none;white-space:nowrap;
    background:none;border:none;padding:0;display:flex;align-items:center;
  }
  .brand span{color:var(--cyan);}
  .brand:hover span{text-shadow:0 0 14px color-mix(in srgb, var(--cyan) 60%, transparent);}
  .search-wrap{flex:1;min-width:200px;position:relative;}
  .search-wrap.search-wrap input{
    padding:8px 34px 8px 100px;background:var(--bg-2);
  }
  .search-wrap input::placeholder{font-style:italic;color:var(--text-faint);}
  .search-icon{
    position:absolute;left:11px;top:50%;transform:translateY(-50%);
    width:15px;height:15px;color:var(--text);pointer-events:none;display:flex;
  }
  .search-icon svg{width:100%;height:100%;display:block;}
  .search-label{
    position:absolute;left:33px;top:50%;transform:translateY(-50%);
    font-family:'Inter',sans-serif;font-weight:700;font-size:11px;letter-spacing:.08em;
    color:var(--text-faint);text-transform:uppercase;pointer-events:none;white-space:nowrap;
  }
  .search-clear{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);
    background:none;border:none;color:var(--text-faint);font-size:15px;padding:4px 6px;line-height:1;
  }
  .search-clear:hover{color:var(--text);}
  .nav-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .btn-donate{border-color:color-mix(in srgb, var(--red) 40%, transparent);color:var(--red);}
  .btn-donate:hover{border-color:var(--red);background:var(--hover-bg-red);}

  /* ---------- Header (save / export row) ---------- */
  .hdr{
    display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
    flex-wrap:wrap;
    margin-bottom:22px;
    padding-bottom:18px;
    border-bottom:1px solid var(--border-soft);
  }
  .hdr-title{display:flex;flex-direction:column;gap:4px;}
  .eyebrow{
    font-family:'Inter',sans-serif;font-size:11px;letter-spacing:.18em;
    color:var(--cyan);text-transform:uppercase;
  }
  h1{
    font-family:'Inter',sans-serif;font-weight:800;font-size:26px;letter-spacing:.03em;
    margin:0;color:var(--text);
    text-shadow:0 0 24px color-mix(in srgb, var(--cyan) 25%, transparent);
  }
  .hdr-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:var(--overlay-bg);backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;
  }
  .modal-box{
    background:var(--panel-2);border:1px solid var(--border);border-radius:12px;
    max-width:520px;width:100%;padding:26px 26px 22px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  .modal-title{font-weight:800;font-size:20px;margin:0 0 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .modal-close{background:none;border:none;color:var(--text-faint);font-size:20px;padding:2px 6px;}
  .modal-close:hover{color:var(--text);}
  .modal-body{font-size:17px;color:var(--text-dim);line-height:1.8;}
  .modal-body ul{margin:12px 0;padding-left:24px;}
  .modal-body li{margin-bottom:12px;}
  .modal-body strong{color:var(--text);}
  .modal-credit{
    margin-top:18px;padding-top:16px;border-top:1px solid var(--border-soft);
    font-size:14px;color:var(--text-faint);
  }
  .modal-credit a{color:var(--cyan);text-decoration:none;}
  .modal-credit a:hover{text-decoration:underline;}
  .modal-heart{color:var(--red);}
  .btn-youtube{
    display:flex;align-items:center;justify-content:center;gap:9px;width:100%;box-sizing:border-box;
    background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    padding:11px 16px;border-radius:7px;font-family:'Inter',sans-serif;font-weight:600;font-size:14px;
    text-decoration:none;transition:border-color .15s, background .15s, transform .1s;
  }
  .btn-youtube:hover{border-color:#ff0000;background:color-mix(in srgb, #ff0000 14%, var(--panel-2));}
  .btn-youtube:active{transform:scale(.98);}
  .btn-youtube svg{width:20px;height:20px;flex-shrink:0;}

  /* ---------- Buttons ----------
     Every button — nav, header, save bar, galaxy/system/planet/moon rows — is the
     same physical size as the search input, and every button of a given *kind*
     (default / primary / rename / delete / planet / moon) hovers the same way
     everywhere it appears. */
  button{font-family:'Inter',sans-serif;cursor:pointer;}
  .btn{
    font-weight:600;font-size:13px;letter-spacing:.03em;
    padding:8px 14px;border-radius:6px;border:1px solid var(--border);
    background:var(--panel-2);color:var(--text);
    display:inline-flex;align-items:center;gap:6px;
    transition:border-color .15s, background .15s, color .15s, transform .1s;
  }
  .btn:hover{border-color:var(--cyan);background:var(--panel-3);}
  .btn:active{transform:scale(.97);}

  /* Primary / constructive action (Add Galaxy, Add System, confirm Save, etc.) */
  .btn-primary{background:linear-gradient(135deg,#1c3550,#142839);border-color:var(--cyan);color:var(--cyan);}
  .btn-primary:hover{background:linear-gradient(135deg,#25415e,#1a3247);border-color:var(--cyan);}

  /* Rename — same blue hover everywhere it appears (save/galaxy/system/planet/moon) */
  .btn-rename{background:transparent;border-color:var(--border);color:var(--text-dim);}
  .btn-rename:hover{border-color:var(--cyan);background:var(--cyan-dim);color:var(--cyan);}

  /* Delete — same red hover everywhere it appears */
  .btn-delete{background:transparent;border-color:var(--border);color:var(--text-dim);}
  .btn-delete:hover{border-color:var(--red);background:var(--hover-bg-red);color:var(--red);}
  .btn-danger{border-color:color-mix(in srgb, var(--red) 45%, transparent);color:var(--red);}
  .btn-danger:hover{border-color:var(--red);background:var(--hover-bg-red);}

  /* Add Planet — green */
  .btn-planet{background:transparent;border-color:color-mix(in srgb, var(--green) 40%, transparent);color:var(--green);}
  .btn-planet:hover{border-color:var(--green);background:var(--hover-bg-green);}

  /* Add Moon — grey */
  .btn-moon{background:transparent;border-color:color-mix(in srgb, var(--moon-c) 45%, transparent);color:var(--moon-c);}
  .btn-moon:hover{border-color:var(--moon-c);background:var(--hover-bg-grey);}

  .btn-ghost{background:transparent;border-color:transparent;color:var(--text-dim);}
  .btn-ghost:hover{color:var(--text);border-color:var(--border);background:var(--panel-3);}
  .btn-sm{padding:8px 14px;font-size:13px;}
  .btn[disabled]{opacity:.4;cursor:not-allowed;}

  input[type=text],textarea,select{
    font-family:'Inter',sans-serif;font-size:13px;
    background:var(--bg-2);border:1px solid var(--border);color:var(--text);
    border-radius:6px;padding:8px 10px;width:100%;outline:none;
  }
  input[type=text]:focus,textarea:focus,select:focus{border-color:var(--cyan);}
  textarea{resize:vertical;min-height:56px;font-family:'Inter',sans-serif;font-size:12.5px;line-height:1.5;}
  label{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.08em;font-family:'Inter',sans-serif;font-weight:600;display:block;margin-bottom:4px;}
  .field{margin-bottom:10px;}
  .field-row{display:flex;gap:10px;flex-wrap:wrap;}
  .field-row>.field{flex:1;min-width:140px;}

  /* ---------- Save selector bar ---------- */
  .save-bar{
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;
    background:var(--panel);border:1px solid var(--border-soft);
    border-radius:10px;padding:12px 14px;margin-bottom:24px;
  }
  .save-bar label{margin:0;}
  .save-bar select{width:auto;min-width:180px;}
  .save-bar .grow{flex:1;min-width:180px;}
  .save-edit-box{
    display:flex;gap:8px;align-items:center;flex-wrap:wrap;
    background:var(--panel-2);border:1px solid var(--border);
    padding:10px;border-radius:8px;margin-top:10px;width:100%;
  }
  .status-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);flex-shrink:0;}
  .autosave-note{font-size:11px;color:var(--text-faint);font-family:'Inter',sans-serif;display:flex;align-items:center;gap:6px;}

  /* ---------- Shared Portal Codes (community-shared addresses, per save) ---------- */
  .shared-portals-title{
    font-family:'Inter',sans-serif;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--text-faint);margin-bottom:14px;display:flex;align-items:center;gap:6px;
  }
  .shared-portals-title .diamond{color:var(--violet);}

  /* ---------- Empty state ---------- */
  .empty{
    text-align:center;padding:50px 20px;color:var(--text-faint);
    border:1px dashed var(--border);border-radius:12px;font-family:'Inter',sans-serif;font-size:15px;
  }

  /* ---------- Pinned systems sidebar ---------- */
  .fav-panel{
    background:var(--panel);border:1px solid var(--border-soft);border-radius:10px;
    padding:14px;
  }
  .fav-title{
    font-family:'Inter',sans-serif;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--text-faint);margin-bottom:10px;display:flex;align-items:center;gap:6px;
  }
  .fav-title .star{color:var(--orange);}
  .fav-list{display:flex;flex-direction:column;gap:8px;}
  .fav-item{
    display:block;width:100%;text-align:left;background:var(--panel-2);
    border:1px solid var(--border);border-left:3px solid var(--orange);border-radius:8px;
    padding:8px 10px;cursor:pointer;font-family:'Inter',sans-serif;
    transition:border-color .15s, background .15s;
  }
  .fav-item:hover{border-color:var(--orange);background:var(--panel-3);}
  .fav-item-name{font-weight:700;font-size:13px;color:var(--text);}
  .fav-item-galaxy{font-size:11px;color:var(--text-faint);margin-top:2px;}
  .fav-empty{font-size:12px;color:var(--text-faint);font-style:italic;line-height:1.5;}

  /* ---------- Galaxy card ---------- */
  .galaxy{
    border:1px solid var(--border);border-radius:14px;margin-bottom:18px;overflow:hidden;
    background:var(--panel);
  }
  .galaxy-head{
    padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    background:
      radial-gradient(ellipse 300px 120px at 90% -30%, var(--galaxy-tint), transparent 70%),
      linear-gradient(135deg, color-mix(in srgb, var(--violet) 6%, var(--panel)), var(--panel));
    border-bottom:1px solid var(--border-soft);
    cursor:pointer;
  }
  .galaxy-title-block{display:flex;flex-direction:column;gap:3px;}
  .galaxy-name{
    font-family:'Inter',sans-serif;font-weight:700;font-size:17px;color:var(--text);
    letter-spacing:.02em;
  }
  .galaxy-meta{font-size:11.5px;color:var(--text-dim);font-family:'Inter',sans-serif;}
  .galaxy-body{padding:16px 18px;}
  .chev{transition:transform .15s;color:var(--text-faint);flex-shrink:0;cursor:pointer;padding:2px;}
  .chev.open{transform:rotate(90deg);}
  .row-actions{display:flex;gap:6px;align-items:center;flex-shrink:0;}

  /* ---------- System card ---------- */
  .system{
    border:1px solid var(--border-soft);border-radius:10px;margin-bottom:12px;overflow:hidden;
    background:var(--panel-2);
  }
  .system.pinned{border-color:color-mix(in srgb, var(--orange) 40%, transparent);}
  .system-head{
    padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
    cursor:pointer;
  }
  .system-title-block{display:flex;align-items:center;gap:9px;min-width:0;}
  .system-name{font-family:'Inter',sans-serif;font-weight:700;font-size:15.5px;color:var(--text);}
  .star-btn{background:none;border:none;font-size:16px;line-height:1;color:var(--text-faint);padding:2px;flex-shrink:0;}
  .star-btn.active{color:var(--orange);text-shadow:0 0 8px var(--glow-gold);}
  .traveller-btn{
    background:none;border:none;padding:1px;flex-shrink:0;
    width:19px;height:19px;display:inline-flex;align-items:center;justify-content:center;
    color:var(--text);opacity:.85;transition:opacity .15s, color .15s, filter .15s;
  }
  .traveller-btn svg{width:100%;height:100%;display:block;}
  .traveller-btn:hover{opacity:1;}
  .traveller-btn.active{color:var(--orange);opacity:1;filter:drop-shadow(0 0 5px var(--glow-gold));}
  .pin-tag{
    font-size:10px;font-family:'Inter',sans-serif;color:var(--orange);border:1px solid color-mix(in srgb, var(--orange) 40%, transparent);
    padding:1px 6px;border-radius:10px;letter-spacing:.05em;flex-shrink:0;
  }
  .system-body{padding:0 14px 14px;}

  .node-box{
    background:var(--bg-2);border:1px solid var(--border);border-left:3px solid var(--meta-c);
    border-radius:8px;padding:12px 14px;margin-bottom:14px;
  }
  .node-label{
    font-family:'Inter',sans-serif;font-size:10.5px;color:var(--meta-c);letter-spacing:.1em;
    text-transform:uppercase;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;
  }
  .node-text{font-family:'Inter',sans-serif;font-size:12.5px;color:var(--text-dim);white-space:pre-wrap;line-height:1.55;}
  .node-text:empty::before{content:"No note logged.";color:var(--text-faint);font-style:italic;}

  /* ---------- Portal glyph address ---------- */
  .portal-box{
    background:var(--bg-2);border:1px solid var(--border);border-left:3px solid var(--violet);
    border-radius:8px;padding:12px 14px;margin-bottom:14px;
  }
  .glyph-row{display:flex;gap:5px;flex-wrap:wrap;align-items:center;min-height:26px;}
  .glyph-icon{
    width:22px;height:22px;flex-shrink:0;object-fit:contain;
    filter:none;
  }
  /* Icons are white-line art on transparent backgrounds — invert to dark strokes in light mode */
  :root[data-theme="light"] .glyph-icon{ filter:invert(1); }
  .glyph-slot{
    width:22px;height:22px;flex-shrink:0;border:1px dashed var(--border);border-radius:4px;
  }
  .glyph-empty-note{font-size:12px;color:var(--text-faint);font-style:italic;font-family:'Inter',sans-serif;}
  .glyph-edit-row{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;}
  .glyph-slot-wrap{position:relative;}
  .glyph-slot-btn{
    width:34px;height:34px;border-radius:6px;border:1px solid var(--border);background:var(--bg-2);
    display:flex;align-items:center;justify-content:center;cursor:pointer;padding:2px;
    transition:border-color .15s, background .15s;
  }
  .glyph-slot-btn:hover{border-color:var(--violet);}
  .glyph-slot-btn.filled{border-color:color-mix(in srgb, var(--violet) 45%, transparent);}
  .glyph-slot-btn.active{border-color:var(--violet);background:var(--panel-3);}
  .glyph-slot-btn .glyph-icon{width:22px;height:22px;}
  .glyph-slot-num{font-family:'Atkinson Hyperlegible Mono',monospace;font-size:11px;color:var(--text-faint);}
  .glyph-picker-panel{
    position:absolute;top:calc(100% + 6px);left:0;z-index:20;
    background:var(--panel-2);border:1px solid var(--border);border-radius:8px;
    padding:8px;box-shadow:0 8px 24px rgba(0,0,0,.4);
    display:grid;grid-template-columns:repeat(4, 32px);gap:6px;width:max-content;
  }
  .glyph-picker-option{
    width:32px;height:32px;border-radius:5px;border:1px solid var(--border);background:var(--bg-2);
    display:flex;align-items:center;justify-content:center;cursor:pointer;padding:2px;
  }
  .glyph-picker-option:hover{border-color:var(--violet);background:var(--panel-3);}
  .glyph-picker-option img{width:20px;height:20px;}
  .glyph-picker-clear{
    grid-column:span 4;font-family:'Inter',sans-serif;font-size:11px;color:var(--text-faint);
    background:none;border:1px dashed var(--border);border-radius:5px;padding:4px;cursor:pointer;
  }
  .glyph-picker-clear:hover{color:var(--text);border-color:var(--border);}
  .entry-card{
    background:var(--panel-2);border:1px solid var(--border);border-radius:8px;
    padding:10px 12px;margin-top:10px;
  }
  .entry-card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px;}
  .entry-card-label{font-family:'Inter',sans-serif;font-weight:700;font-size:13px;color:var(--text);}

  /* ---------- Planet / moon tiles ----------
     Planets are always blue, moons are always grey — no per-kind color coding.
     The "kind" label and resource chips share one muted amber accent so the
     card isn't fighting itself with lots of different colors. */
  .tiles{display:flex;flex-direction:column;gap:10px;}
  .tile{
    border-radius:9px;border:1px solid var(--border);background:var(--panel-3);
    padding:11px 13px;position:relative;border-left:3px solid var(--kc,var(--planet-c));
  }
  .tile-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .tile-title-block{display:flex;align-items:center;gap:9px;min-width:0;flex-wrap:wrap;}
  .hex{
    width:22px;height:22px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    background:color-mix(in srgb, var(--kc,var(--planet-c)) 18%, transparent);
    clip-path:polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    font-size:10px;color:var(--kc,var(--planet-c));font-weight:700;
  }
  .tile-name{font-family:'Inter',sans-serif;font-weight:700;font-size:14.5px;color:var(--text);}
  .tile-kind{font-size:12.5px;color:var(--meta-c);font-family:'Atkinson Hyperlegible Mono',monospace;font-weight:600;letter-spacing:.02em;}
  .tile-flora{font-size:12.5px;color:var(--green);font-family:'Atkinson Hyperlegible Mono',monospace;margin-top:6px;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center;}
  .chip-row-label{
    font-family:'Inter',sans-serif;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--text-faint);margin-right:2px;
  }
  .sentinel-badge{
    display:inline-flex;align-items:center;gap:4px;font-family:'Atkinson Hyperlegible Mono',monospace;
    font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:10px;margin-top:8px;
    border:1px solid var(--border);color:var(--text-dim);
  }
  .sentinel-badge.sentinel-low{color:var(--moon-c);border-color:color-mix(in srgb, var(--moon-c) 45%, transparent);}
  .sentinel-badge.sentinel-high{color:var(--orange);border-color:color-mix(in srgb, var(--orange) 45%, transparent);}
  .sentinel-badge.sentinel-aggressive{color:var(--red);border-color:color-mix(in srgb, var(--red) 45%, transparent);}
  .sentinel-badge.sentinel-dissonance{color:var(--violet);border-color:color-mix(in srgb, var(--violet) 45%, transparent);}
  .chip{
    font-family:'Atkinson Hyperlegible Mono',monospace;font-size:12.5px;color:var(--text);
    background:var(--bg-2);border:1px solid var(--border);
    border-radius:5px;padding:2px 8px;
  }
  .moons{margin-top:10px;padding-left:16px;border-left:2px dotted var(--border);display:flex;flex-direction:column;gap:8px;}
  .moon-tile{border-left-width:3px;background:var(--panel-2);}

  .add-row{margin-top:10px;}
  .add-inline{
    border:1px dashed var(--border);border-radius:9px;padding:12px;background:var(--bg-2);
  }

  .section-label{
    font-family:'Inter',sans-serif;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--text-faint);margin:14px 0 8px;
  }

  mark.search-hit{
    background:color-mix(in srgb, var(--orange) 55%, transparent);
    color:var(--text);border-radius:3px;padding:0 2px;font-weight:700;
  }

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--panel-3);border:1px solid var(--cyan);color:var(--cyan);
    font-family:'Inter',sans-serif;font-size:12px;padding:9px 16px;border-radius:8px;
    opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:50;
    box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .kind-list{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;}
  .kind-pick{
    font-size:10.5px;font-family:'Inter',sans-serif;color:var(--text-faint);
    border:1px solid var(--border);padding:2px 7px;border-radius:5px;background:var(--bg-2);
  }
  .kind-pick:hover{border-color:var(--cyan);color:var(--cyan);}

  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-track{background:var(--bg-2);}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px;}

  @media (max-width:520px){
    h1{font-size:20px;}
    .save-bar select{min-width:0;width:100%;}
  }

  /* ---------- Footer ---------- */
  .site-footer{
    display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
    margin-top:32px;padding-top:18px;border-top:1px solid var(--border-soft);
  }
  .site-footer-brand{
    font-family:'Inter',sans-serif;font-weight:800;font-size:15px;color:var(--text);
  }
  .site-footer-brand span{color:var(--cyan);}
  .site-footer-credit{font-family:'Inter',sans-serif;font-size:13px;color:var(--text-faint);}
  .site-footer-credit a{color:var(--cyan);text-decoration:none;}
  .site-footer-credit a:hover{text-decoration:underline;}
</style>

function renderChips(list){
  if(!list.length) return '';
  return `<div class="chips">${list.map(r=>`<span class="chip">${highlight(r)}</span>`).join('')}</div>`;
}

  if(!list || !list.length) return '';

  { label:'Dissonance Sentinels', cls:'sentinel-dissonance' },
];
function sentinelClass(label){
  const found = SENTINEL_LEVELS.find(s=>s.label===label);
  return found ? found.cls : '';
}
function sentinelOptions(selected){
  return `<option value=""${!selected?' selected':''}>—</option>` +
    SENTINEL_LEVELS.map(s=>`<option value="${esc(s.label)}"${selected===s.label?' selected':''}>${esc(s.label)}</option>`).join('');
}
function renderSentinelBadge(label){
  if(!label) return '';
  return `<span class="sentinel-badge ${sentinelClass(label)}">☉ ${esc(label)}</span>`;

function normalizeCode(code){
  // Always returns a 12-length array of '' or a hex char, regardless of what was stored.
  const c = Array.isArray(code) ? code.slice(0,12) : [];
  while(c.length<12) c.push('');
  return c;
}

  if(!char) return `<span class="glyph-slot"></span>`;
  return `<img class="glyph-icon" src="${GLYPH_ICONS[char]}" alt="${char}" title="${char}">`;
}
function renderGlyphRow(code){
  const c = normalizeCode(code);
  if(c.every(x=>!x)) return `<span class="glyph-empty-note">No glyph code entered yet.</span>`;
  return `<div class="glyph-row">${c.map(glyphIconHtml).join('')}</div>`;
}
function renderGlyphEditRow(idPrefix, code){
  ensureGlyphDraft(idPrefix, code);
  return `<div class="glyph-edit-row" id="glyphrow-${idPrefix}">${renderGlyphSlotsHtml(idPrefix)}</div>`;
}
function renderGlyphSlotsHtml(idPrefix){
  const draft = glyphDrafts[idPrefix] || Array(12).fill('');
  let html = '';
  for(let i=0;i<12;i++){
    const val = draft[i];
    const pickerKey = idPrefix+'::'+i;
    const isOpen = openGlyphPicker === pickerKey;
    html += `<div class="glyph-slot-wrap">
      <button type="button" class="glyph-slot-btn ${val?'filled':''} ${isOpen?'active':''}" onclick="toggleGlyphPicker('${idPrefix}',${i})" title="${val?('Glyph '+val):'Choose a glyph'}">
        ${val ? `<img class="glyph-icon" src="${GLYPH_ICONS[val]}" alt="${val}">` : `<span class="glyph-slot-num">${i+1}</span>`}
      </button>
      ${isOpen ? renderGlyphPickerPanel(idPrefix, i) : ''}
    </div>`;
  }
  return html;
}
function renderGlyphPickerPanel(idPrefix, i){
  const options = GLYPH_ORDER.map(g=>`
    <button type="button" class="glyph-picker-option" onclick="pickGlyph('${idPrefix}',${i},'${g}')" title="${g}">
      <img class="glyph-icon" src="${GLYPH_ICONS[g]}" alt="${g}">
    </button>`).join('');
  return `<div class="glyph-picker-panel">
    ${options}
    <button type="button" class="glyph-picker-clear" onclick="pickGlyph('${idPrefix}',${i},'')">Clear</button>
  </div>`;
}
// Refreshes just the 12-slot row in place (not a full render()) so any text
// already typed into other fields in the same form is never lost.
function refreshGlyphRow(idPrefix){
  const el = document.getElementById('glyphrow-'+idPrefix);
  if(el) el.innerHTML = renderGlyphSlotsHtml(idPrefix);
}
function toggleGlyphPicker(idPrefix, i){
  const key = idPrefix+'::'+i;
  openGlyphPicker = (openGlyphPicker===key) ? null : key;
  refreshGlyphRow(idPrefix);
}
function pickGlyph(idPrefix, i, val){
  const draft = glyphDrafts[idPrefix] || Array(12).fill('');
  draft[i] = val;
  glyphDrafts[idPrefix] = draft;
  openGlyphPicker = null;
  refreshGlyphRow(idPrefix);
}
function ensureGlyphDraft(idPrefix, code){
  if(!glyphDrafts[idPrefix]) glyphDrafts[idPrefix] = normalizeCode(code);
  return glyphDrafts[idPrefix];
}
function clearGlyphDraft(idPrefix){
  delete glyphDrafts[idPrefix];
  if(openGlyphPicker && openGlyphPicker.startsWith(idPrefix+'::')) openGlyphPicker = null;
}
function readGlyphEditRow(idPrefix){
  return (glyphDrafts[idPrefix] || Array(12).fill('')).slice();
}

/* ---------------------------- persistence ----------------------------
   This file is meant to be saved and opened directly in your own browser
   (double-click the .html file), so it uses plain localStorage rather than
   any Claude-artifact-only storage API. localStorage is built into every
   browser and works fully offline — your data lives in this browser, tied
   to this file, and nothing is sent anywhere. Use Export/Import JSON below
   to back it up or move it to another browser or computer. */
let saveTimer = null;
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(persist, 400);
}
function persist(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    showToast('Saved locally ✓');
  }catch(e){
    console.error('Storage error', e);
    showToast('Could not save — your browser blocked local storage');
  }
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      state = JSON.parse(raw);
      return;
    }
  }catch(e){ /* corrupt data or storage unavailable */ }
  state = seedState();
  persist();
}

/* ------------------------------- toast --------------------------------- */
let toastTimer=null;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1600);
}

/* ------------------------------ helpers --------------------------------- */
function getActiveSave(){ return (state.saves||[]).find(s=>s.id===state.activeSaveId) || state.saves[0]; }
function esc(str){
  return (str||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
// Like esc(), but when a search is active, wraps the matching substring in a
// <mark> so the hit visually jumps out instead of making people read every
// word of every result to find it.
function highlight(str){
  const escaped = esc(str);
  const query = q();
  if(!query) return escaped;
  const safeQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp('('+safeQuery+')', 'ig');
  return escaped.replace(re, '<mark class="search-hit">$1</mark>');
}
function parseResources(str){
  return str.split(',').map(s=>s.trim()).filter(Boolean);
}

/* ------------------------------ search -------------------------------- */
function q(){ return searchQuery.trim().toLowerCase(); }
function textHas(str){ return (str||'').toLowerCase().includes(q()); }
function moonMatches(m){
  return textHas(m.name) || textHas(m.kind) || textHas(m.flora)
    || (m.resources||[]).some(r=>textHas(r)) || (m.artifacts||[]).some(r=>textHas(r));
}
function planetMatches(p){
  return textHas(p.name) || textHas(p.kind) || textHas(p.flora)
    || (p.resources||[]).some(r=>textHas(r)) || (p.artifacts||[]).some(r=>textHas(r))
    || p.moons.some(moonMatches);
}
function galaxyNameMatches(g){ return textHas(g.name); }
function systemMatches(s){
  return textHas(s.name) || textHas(s.node.notes) || s.planets.some(planetMatches);
}
function systemVisible(g, s){
  if(!q()) return true;
  return galaxyNameMatches(g) || systemMatches(s);
}
function galaxyVisible(g){
  if(!q()) return true;
  return galaxyNameMatches(g) || g.systems.some(s=>systemVisible(g,s));
}
function isGalaxyOpen(id){ return q() ? true : openGalaxies.has(id); }
function isSystemOpen(id){ return q() ? true : openSystems.has(id); }

function renderContent(){
  const el = document.getElementById('content');
  const save = getActiveSave();
  if(!save) return; // nothing to search/show yet — onboarding screen owns #content right now
  const searching = !!q();

  const visibleGalaxies = save.galaxies.filter(galaxyVisible);

  let html = `<div class="section-label">${searching ? `Matches for "${esc(searchQuery.trim())}"` : `Galaxies in ${esc(save.name)}`}</div>`;

  if(save.galaxies.length===0){
    if(addingChild.has('galaxy:'+save.id)){
      html += renderAddGalaxyForm(save.id);
    } else {
      html += `<div class="empty">No galaxies charted yet.<br><br>
        <button class="btn btn-primary btn-sm" onclick="startAddGalaxy()">+ Chart a Galaxy</button></div>`;
    }
  } else if(searching && visibleGalaxies.length===0){
    html += `<div class="empty">No galaxies, systems, planets, or moons match that search.</div>`;
  } else {
    html += visibleGalaxies.map(g=>renderGalaxy(g)).join('');
    if(!searching){
      html += `<div class="add-row">`;
      if(addingChild.has('galaxy:'+save.id)){
        html += renderAddGalaxyForm(save.id);
      } else {
        html += `<button class="btn btn-primary btn-sm" onclick="startAddGalaxy()">+ Add Galaxy</button>`;
      }
      html += `</div>`;
    }
  }

  el.innerHTML = html;
}

function renderGalaxy(g){
  const isOpen = isGalaxyOpen(g.id);
  const isEditing = editing.has('galaxy:'+g.id);
  const planetCount = g.systems.reduce((a,s)=>a+s.planets.length,0);
  const moonCount = g.systems.reduce((a,s)=>a+s.planets.reduce((b,p)=>b+p.moons.length,0),0);

  let head = `
    <div class="galaxy-head" onclick="toggleGalaxy('${g.id}')">
      <div class="galaxy-title-block">
        <div class="galaxy-name">${highlight(g.name)}</div>
        <div class="galaxy-meta">${g.systems.length} system${g.systems.length!==1?'s':''} · ${planetCount} planet${planetCount!==1?'s':''} · ${moonCount} moon${moonCount!==1?'s':''}</div>
      </div>
      <div class="row-actions" onclick="event.stopPropagation()">
        <button class="btn btn-rename btn-sm" onclick="editing.has('galaxy:${g.id}')?0:startEditGalaxy('${g.id}')">✎ Rename</button>
        <button class="btn btn-delete btn-sm" onclick="deleteGalaxy('${g.id}')">🗑 Delete</button>
        <span class="chev ${isOpen?'open':''}" onclick="toggleGalaxy('${g.id}')">▶</span>
      </div>
    </div>`;

  let body = '';
  if(isOpen){
    body += `<div class="galaxy-body">`;
    if(isEditing){
      body += `
        <div class="add-inline" style="margin-bottom:14px;">
          <div class="field"><label>Galaxy Name</label>
            <input type="text" id="editGalaxyName-${g.id}" value="${esc(g.name)}">
          </div>
          <div class="row-actions">
            <button class="btn btn-primary btn-sm" onclick="confirmEditGalaxy('${g.id}')">Save</button>
            <button class="btn btn-ghost btn-sm" onclick="editing.delete('galaxy:${g.id}');render()">Cancel</button>
          </div>
        </div>`;
    }

    const sorted = [...g.systems]
      .filter(s=>systemVisible(g,s))
      .sort((a,b)=> (b.favorite?1:0) - (a.favorite?1:0));
    if(sorted.length===0){
      body += `<div class="empty" style="padding:24px;">${q() ? 'No systems here match that search.' : 'No systems logged in this galaxy yet.'}</div>`;
    } else {
      body += sorted.map(s=>renderSystem(g, s)).join('');
    }

    if(!q()){
      body += `<div class="add-row">`;
      if(addingChild.has('system:'+g.id)){
        body += renderAddSystemForm(g.id);
      } else {
        body += `<button class="btn btn-primary btn-sm" onclick="addingChild.add('system:${g.id}');render()">+ Add System</button>`;
      }
      body += `</div>`;
    }
    body += `</div>`;
  }

  return `<div class="galaxy">${head}${body}</div>`;
}
function toggleGalaxy(id){
  if(openGalaxies.has(id)) openGalaxies.delete(id); else openGalaxies.add(id);
  render();
}
function startEditGalaxy(id){ editing.add('galaxy:'+id); render(); }
function confirmEditGalaxy(id){
  const v = document.getElementById('editGalaxyName-'+id).value.trim();
  if(!v){ showToast('Galaxy needs a name'); return; }
  const g = findGalaxy(id); g.name=v;
  editing.delete('galaxy:'+id);
  scheduleSave(); render();
}
function deleteGalaxy(id){
  if(!confirm('Delete this galaxy and everything charted inside it?')) return;
  const save = getActiveSave();
  save.galaxies = save.galaxies.filter(g=>g.id!==id);
  scheduleSave(); render();
}
function findGalaxy(id){
  for(const save of state.saves) for(const g of save.galaxies) if(g.id===id) return g;
}
function findSystem(id){
  for(const save of state.saves) for(const g of save.galaxies) for(const s of g.systems) if(s.id===id) return s;
}
function findPlanet(id){
  for(const save of state.saves) for(const g of save.galaxies) for(const s of g.systems) for(const p of s.planets) if(p.id===id) return p;
}
function findMoonHost(moonId){
  for(const save of state.saves) for(const g of save.galaxies) for(const s of g.systems) for(const p of s.planets)
    for(const m of p.moons) if(m.id===moonId) return {planet:p, moon:m};
}

function renderSystem(g, s){
  const isOpen = isSystemOpen(s.id);
  const isEditing = editing.has('system:'+s.id);

  let head = `
    <div class="system-head" onclick="toggleSystem('${s.id}')">
      <div class="system-title-block">
        <button class="star-btn ${s.favorite?'active':''}" title="Pin to top of galaxy" onclick="event.stopPropagation();toggleFavorite('${s.id}')">${s.favorite?'★':'☆'}</button>
        <button class="traveller-btn ${s.traveller?'active':''}" title="${s.traveller?'Traveller present — click to clear':'Mark this system as having a Traveller'}" onclick="event.stopPropagation();toggleTraveller('${s.id}')">${TRAVELLER_ICON_SVG}</button>
        <span class="system-name">${highlight(s.name)}</span>
        ${s.favorite?'<span class="pin-tag">PINNED</span>':''}
        <span class="galaxy-meta">${s.planets.length} planet${s.planets.length!==1?'s':''}, ${s.planets.reduce((a,p)=>a+p.moons.length,0)} moon${s.planets.reduce((a,p)=>a+p.moons.length,0)!==1?'s':''}</span>
      </div>
      <div class="row-actions" onclick="event.stopPropagation()">
        <button class="btn btn-rename btn-sm" onclick="editing.add('system:${s.id}');render()">✎ Rename</button>
        <button class="btn btn-delete btn-sm" onclick="deleteSystem('${g.id}','${s.id}')">🗑 Delete</button>
        <span class="chev ${isOpen?'open':''}" onclick="toggleSystem('${s.id}')">▶</span>
      </div>
    </div>`;

  let body = '';
  if(isOpen){
    body += `<div class="system-body">`;

    if(isEditing){
      body += `
        <div class="add-inline" style="margin-bottom:12px;">
          <div class="field"><label>System Name</label>
            <input type="text" id="editSystemName-${s.id}" value="${esc(s.name)}">
          </div>
          <div class="row-actions">
            <button class="btn btn-primary btn-sm" onclick="confirmEditSystem('${s.id}')">Save</button>
            <button class="btn btn-ghost btn-sm" onclick="editing.delete('system:${s.id}');render()">Cancel</button>
          </div>
        </div>`;
    }

    // Node section — always shown before planets
    const isEditingNode = editing.has('node:'+s.id);
    body += `<div class="node-box">
      <div class="node-label"><span>◆ System Note</span>
        ${isEditingNode?'':`<button class="btn btn-rename btn-sm" onclick="editing.add('node:${s.id}');render()">✎ Edit</button>`}
      </div>`;
    if(isEditingNode){
      body += `
        <textarea id="nodeNotes-${s.id}" placeholder="Base coordinates, portal glyphs, trade notes, anything worth remembering about this system...">${esc(s.node.notes)}</textarea>
        <div class="row-actions" style="margin-top:8px;">
          <button class="btn btn-primary btn-sm" onclick="confirmEditNode('${s.id}')">Save Note</button>
          <button class="btn btn-ghost btn-sm" onclick="editing.delete('node:${s.id}');render()">Cancel</button>
        </div>`;
    } else {
      body += `<div class="node-text">${highlight(s.node.notes)}</div>`;
    }
    body += `</div>`;

    // Portal glyph address (this system's own code)
    body += renderPortalBox(s);

    // Planets
    body += `<div class="section-label">Planets &amp; Moons</div>`;
    if(s.planets.length===0){
      body += `<div class="empty" style="padding:20px;">No planets surveyed in this system.</div>`;
    } else {
      body += `<div class="tiles">${s.planets.map(p=>renderPlanet(s,p)).join('')}</div>`;
    }

    if(!q()){
      body += `<div class="add-row">`;
      if(addingChild.has('planet:'+s.id)){
        body += renderAddPlanetForm(s.id);
      } else {
        body += `<button class="btn btn-planet btn-sm" onclick="addingChild.add('planet:${s.id}');render()">+ Add Planet</button>`;
      }
      body += `</div>`;
    }

    body += `</div>`;
  }

  return `<div class="system ${s.favorite?'pinned':''}" id="system-${s.id}">${head}${body}</div>`;
}

      <div class="row-actions">
        <button class="btn btn-primary btn-sm" onclick="confirmEditMoon('${m.id}')">Save</button>
        <button class="btn btn-ghost btn-sm" onclick="editing.delete('moon:${m.id}');render()">Cancel</button>
      </div>`;
  } else {
    html += `
      <div class="tile-head">
        <div class="tile-title-block">
          <span class="hex">M</span>
          <span class="tile-name">${highlight(m.name)}</span>
          ${m.kind?`<span class="tile-kind">${highlight(m.kind)}</span>`:''}
        </div>
        <div class="row-actions">
          <button class="btn btn-rename btn-sm" onclick="editing.add('moon:${m.id}');render()">✎ Rename</button>
          <button class="btn btn-delete btn-sm" onclick="deleteMoon('${planet.id}','${m.id}')">🗑 Delete</button>
        </div>
      </div>
      ${m.flora?`<div class="tile-flora">🌱 ${highlight(m.flora)}</div>`:''}
      ${renderLabeledChips('Artifacts', m.artifacts)}
      ${renderLabeledChips('Resources', m.resources)}
      ${renderSentinelBadge(m.sentinel)}
    `;
  }
  html += `</div>`;
  return html;
}
function confirmEditMoon(id){
  const name = document.getElementById('em-name-'+id).value.trim();
  if(!name){ showToast('Moon needs a name'); return; }
  const found = findMoonHost(id);
  found.moon.name = name;
  found.moon.kind = document.getElementById('em-kind-'+id).value.trim();
  found.moon.flora = document.getElementById('em-flora-'+id).value.trim();
  found.moon.artifacts = parseResources(document.getElementById('em-artifacts-'+id).value);
  found.moon.resources = parseResources(document.getElementById('em-res-'+id).value);
  found.moon.sentinel = document.getElementById('em-sentinel-'+id).value;
  editing.delete('moon:'+id);
  scheduleSave(); render();
}
function deleteMoon(planetId, moonId){
  if(!confirm('Delete this moon?')) return;
  const p = findPlanet(planetId);
  p.moons = p.moons.filter(m=>m.id!==moonId);
  scheduleSave(); render();
}

/* --------------------------- export / import ---------------------------- */
document.getElementById('btnExport').onclick = ()=>{
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const date = new Date().toISOString().slice(0,10);
  a.href = url; a.download = `nms-voyage-log-${date}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast('Export downloaded');
};
document.getElementById('btnImportTrigger').onclick = ()=>{
  document.getElementById('fileImport').click();
};
document.getElementById('fileImport').onchange = (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed.saves || !Array.isArray(parsed.saves)) throw new Error('bad shape');
      if(confirm('Import this file? It will replace everything currently in your voyage log.')){
        state = parsed;
        if(!state.activeSaveId || !state.saves.find(s=>s.id===state.activeSaveId)){
          state.activeSaveId = state.saves[0] ? state.saves[0].id : null;
        }
        scheduleSave(); render();
        showToast('Import complete');
      }
    }catch(err){
      showToast('That file does not look like a valid voyage log export');
    }
    e.target.value = '';
  };
  reader.readAsText(file);
};

/* ------------------------------ nav wiring -------------------------------- */
document.getElementById('searchInput').oninput = (e)=>{
  searchQuery = e.target.value;
  document.getElementById('searchClear').style.display = searchQuery ? 'block' : 'none';
  renderContent();
};
document.getElementById('searchClear').onclick = ()=>{
  searchQuery = '';
  const input = document.getElementById('searchInput');
  input.value = '';
  document.getElementById('searchClear').style.display = 'none';
  renderContent();
  input.focus();
};
document.getElementById('btnHome').onclick = ()=>{
  closeModal();
  viewMode = 'log';
  searchQuery = '';
  document.getElementById('searchInput').value = '';
  document.getElementById('searchClear').style.display = 'none';
  openGalaxies.clear();
  openSystems.clear();
  editing.clear();
  addingChild.clear();
  const save = getActiveSave();
  if(save && save.galaxies[0]){
    openGalaxies.add(save.galaxies[0].id);
    if(save.galaxies[0].systems[0]) openSystems.add(save.galaxies[0].systems[0].id);
  }
  render();
  window.scrollTo({top:0, behavior:'smooth'});
};

document.getElementById('btnSharedPortals').onclick = openSharedPortals;
document.getElementById('btnBackToTop').onclick = ()=>{
  window.scrollTo({top:0, behavior:'smooth'});
};

/* ------------------------------- theme toggle ------------------------------- */
function applyThemeButtonLabel(){
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  document.getElementById('btnThemeToggle').textContent = isLight ? '☀ Light' : '🌙 Dark';
}
document.getElementById('btnThemeToggle').onclick = ()=>{
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  if(isLight){
    document.documentElement.removeAttribute('data-theme');
  } else {
    document.documentElement.setAttribute('data-theme','light');
  }
  try{ localStorage.setItem('nms-buddy-theme', isLight ? 'dark' : 'light'); }catch(e){}
  applyThemeButtonLabel();
};
applyThemeButtonLabel();

  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal-box">
        <div class="modal-title"><span>${title}</span>
          <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body">${bodyHtml}</div>
      </div>
    </div>`;
}
function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }

/* --------------------------------- boot ---------------------------------- */
(function init(){
  try{
    loadState();
    // open the first galaxy / first pinned or first system by default for orientation
    const save = getActiveSave();
    if(save && save.galaxies[0]){
      openGalaxies.add(save.galaxies[0].id);
      if(save.galaxies[0].systems[0]) openSystems.add(save.galaxies[0].systems[0].id);
    }
    render();
  }catch(e){
    console.error('Boot error', e);
    document.getElementById('content').innerHTML = `
      <div class="empty" style="border-color:var(--red);color:var(--red);">
        Something went wrong loading the voyage log.<br>
        <span style="color:var(--text-faint);font-size:12px;">${esc(e.message||String(e))}</span><br><br>
        <button class="btn btn-primary btn-sm" onclick="location.reload()">Reload</button>
      </div>`;
  }
})();

</script>
